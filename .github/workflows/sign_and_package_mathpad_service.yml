name: Sign and Package Mathpad Service

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish a GitHub Release from this build"
        type: boolean
        default: false
      release_tag:
        description: "Tag for the release, e.g. v1.1.0 (only needed if publishing)"
        type: string
        required: false

permissions:
  contents: write

jobs:
  sign-and-package:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        # Install fileicon for setting DMG icon
        brew install fileicon

    - name: Build Mathpad Service
      run: |
        cd software/mac/mathpad-service
        chmod +x build.sh
        ./build.sh

    - name: Validate built binary (arch, min-OS, plist, launch)
      run: |
        cd software/mac/mathpad-service
        BIN="dist/Install.app/Contents/Resources/mathpad-service.app/Contents/MacOS/mathpad-service"

        echo "== Architectures =="
        lipo -info "$BIN"
        lipo -info "$BIN" | grep -q "arm64"  || { echo "::error::missing arm64 slice";  exit 1; }
        lipo -info "$BIN" | grep -q "x86_64" || { echo "::error::missing x86_64 slice"; exit 1; }

        echo "== Minimum OS per slice =="
        check_minos () {  # $1=arch  $2=expected
          local got
          got=$(vtool -arch "$1" -show-build "$BIN" | awk '/minos/ {print $2}')
          echo "$1 minos=$got (expected $2)"
          [ "$got" = "$2" ] || { echo "::error::$1 min-OS is $got, expected $2"; exit 1; }
        }
        check_minos arm64  11.0
        check_minos x86_64 10.14.4

        echo "== Info.plist lint =="
        plutil -lint "dist/Install.app/Contents/Resources/mathpad-service.app/Contents/Info.plist"

        echo "== Launch smoke test =="
        "$BIN" --version

    - name: Import Code Signing Certificate
      run: |
        # Create temporary keychain
        echo "${{ secrets.APPLE_DEVELOPER_ID_CERT }}" | base64 --decode > certificate.p12
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        
        # Import certificate
        security import certificate.p12 -k build.keychain -P "${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
        
        # Clean up certificate file
        rm certificate.p12

    - name: Extract Version
      run: |
        # Check if the mathpad-service binary exists in the expected location
        BINARY_PATH="software/mac/mathpad-service/dist/Install.app/Contents/Resources/mathpad-service.app/Contents/MacOS/mathpad-service"
        
        if [ ! -f "$BINARY_PATH" ]; then
          echo "Error: mathpad-service binary not found at $BINARY_PATH"
          echo "Contents of dist directory:"
          ls -la software/mac/mathpad-service/dist/ || echo "dist directory not found"
          echo "Contents of Install.app:"
          ls -la software/mac/mathpad-service/dist/Install.app/ || echo "Install.app not found"
          echo "Contents of Resources:"
          ls -la software/mac/mathpad-service/dist/Install.app/Contents/Resources/ || echo "Resources directory not found"
          echo "Contents of mathpad-service.app:"
          ls -la software/mac/mathpad-service/dist/Install.app/Contents/Resources/mathpad-service.app/ || echo "mathpad-service.app not found"
          echo "Contents of MacOS:"
          ls -la software/mac/mathpad-service/dist/Install.app/Contents/Resources/mathpad-service.app/Contents/MacOS/ || echo "MacOS directory not found"
        fi
        
        # Get version from the mathpad-service executable
        VERSION_OUTPUT=$($BINARY_PATH --version)
        VERSION=$(echo "$VERSION_OUTPUT" | grep "Mathpad Service v" | sed 's/Mathpad Service v//')
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Detected version: $VERSION"

    - name: Sign Installer App
      run: |
        cd software/mac/mathpad-service/dist
        
        # First, sign the mathpad-service executable inside the app bundle
        echo "🔐 Signing mathpad-service executable..."
        codesign --force --sign "Developer ID Application" --timestamp --options runtime "Install.app/Contents/Resources/mathpad-service.app/Contents/MacOS/mathpad-service"
    
        # Then sign the mathpad-service.app bundle
        echo "🔐 Signing mathpad-service.app bundle..."
        codesign --force --sign "Developer ID Application" --timestamp --options runtime "Install.app/Contents/Resources/mathpad-service.app"
        
        # Verify the mathpad-service.app is signed
        codesign --verify --verbose "Install.app/Contents/Resources/mathpad-service.app"
        echo "✅ mathpad-service.app bundle signed"
        
        # Finally sign the entire Install.app bundle
        echo "🔐 Signing Install.app bundle..."
        codesign --force --sign "Developer ID Application" --timestamp --options runtime "Install.app"
        
        # Verify the entire app is signed
        codesign --verify --verbose "Install.app"
        codesign --verify --deep --strict --verbose=2 "Install.app"
        echo "✅ Install.app bundle signed successfully"

    - name: Create DMG
      run: |
        cd software/mac/mathpad-service
        
        # Create DMG from the dist folder (which contains Install.app)
        hdiutil create -volname "Mathpad Service" -srcfolder dist -ov -format UDZO "mathpad-service-${{ env.VERSION }}.dmg"
        
        # Set the DMG icon
        fileicon set "mathpad-service-${{ env.VERSION }}.dmg" ../applet.icns

    - name: Sign DMG
      run: |
        cd software/mac/mathpad-service
        
        # Sign the DMG
        codesign --force --sign "Developer ID Application" --timestamp "mathpad-service-${{ env.VERSION }}.dmg"
        codesign --verify --verbose "mathpad-service-${{ env.VERSION }}.dmg"
        echo "✅ DMG signed successfully"

    - name: Pre-Notarization Debug Info
      run: |
        cd software/mac/mathpad-service/dist
        
        echo "🔍 Pre-notarization verification..."
        echo "File size of Install.app:"
        du -sh "Install.app"
        
        echo "Code signing verification:"
        codesign --verify --deep --strict --verbose=2 "Install.app"
        
        echo "Code signing display info:"
        codesign --display --verbose=4 "Install.app"
        
        echo "Security assessment:"
        spctl --assess --verbose "Install.app" || echo "⚠️ Security assessment failed (expected for unsigned apps)"
        
        echo "Bundle info:"
        plutil -p "Install.app/Contents/Info.plist" | head -20

    - name: Notarize Installer App
      run: |
        cd software/mac/mathpad-service/dist
        
        # Create zip of the installer app
        zip -r install-app.zip "Install.app"
        
        # Submit for notarization and capture submission ID
        echo "🚀 Submitting Install.app for notarization..."
        SUBMISSION_OUTPUT=$(xcrun notarytool submit install-app.zip \
          --apple-id "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APPLE_ID_PASSWORD }}" \
          --team-id "${{ secrets.APPLE_TEAM_ID }}" \
          --output-format json)
        
        echo "Submission response: $SUBMISSION_OUTPUT"
        SUBMISSION_ID=$(echo $SUBMISSION_OUTPUT | jq -r '.id')
        echo "Submission ID: $SUBMISSION_ID"
        
        # Wait and check status in a loop with better logging
        echo "⏳ Waiting for notarization to complete..."
        for i in {1..60}; do  # Check for 30 minutes (60 * 30 seconds)
          sleep 30
          STATUS_OUTPUT=$(xcrun notarytool info $SUBMISSION_ID \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --output-format json)
          
          STATUS=$(echo $STATUS_OUTPUT | jq -r '.status')
          echo "[$i/60] Current status: $STATUS ($(date))"
          
          if [ "$STATUS" = "Accepted" ]; then
            echo "✅ Install.app notarized successfully!"
            break
          elif [ "$STATUS" = "Invalid" ]; then
            echo "❌ Notarization failed!"
            echo "Full status response: $STATUS_OUTPUT"
            # Get detailed log
            echo "📋 Fetching notarization log..."
            xcrun notarytool log $SUBMISSION_ID \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_ID_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}"
            exit 1
          elif [ "$STATUS" = "Rejected" ]; then
            echo "❌ Notarization rejected!"
            echo "Full status response: $STATUS_OUTPUT"
            # Get detailed log
            echo "📋 Fetching notarization log..."
            xcrun notarytool log $SUBMISSION_ID \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_ID_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}"
            exit 1
          fi
        done
        
        # Final status check
        FINAL_STATUS=$(echo $STATUS_OUTPUT | jq -r '.status')
        if [ "$FINAL_STATUS" != "Accepted" ]; then
          echo "❌ Notarization timed out. Final status: $FINAL_STATUS"
          exit 1
        fi
        
        rm install-app.zip

    - name: Notarize DMG
      run: |
        cd software/mac/mathpad-service
        
        # Submit DMG for notarization with longer timeout
        xcrun notarytool submit "mathpad-service-${{ env.VERSION }}.dmg" \
          --apple-id "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APPLE_ID_PASSWORD }}" \
          --team-id "${{ secrets.APPLE_TEAM_ID }}" \
          --wait \
          --timeout 30m

    - name: Staple Notarization
      run: |
        cd software/mac/mathpad-service
        
        # Staple the notarization to the DMG
        xcrun stapler staple "mathpad-service-${{ env.VERSION }}.dmg"
        
        # Verify stapling worked
        xcrun stapler validate "mathpad-service-${{ env.VERSION }}.dmg"
        echo "✅ DMG notarization stapled successfully"

    - name: Final Security Verification
      run: |
        cd software/mac/mathpad-service
        
        # Final verification that everything is properly signed and notarized
        echo "🔍 Verifying installer app..."
        spctl --assess --verbose "dist/Install.app"
        
        echo "🔍 Verifying DMG..."
        spctl --assess --type open --context context:primary-signature "mathpad-service-${{ env.VERSION }}.dmg"
        
        echo "✅ All components verified! DMG is ready for distribution."

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v6
      with:
        name: mathpad-service-${{ env.VERSION }}.dmg
        path: software/mac/mathpad-service/mathpad-service-${{ env.VERSION }}.dmg

    - name: Create GitHub Release
      if: ${{ inputs.create_release }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        files: software/mac/mathpad-service/mathpad-service-${{ env.VERSION }}.dmg
        name: Mathpad Service ${{ env.VERSION }}
        body: |
          ## Mathpad Service ${{ env.VERSION }}

          Signed and notarized universal (arm64 + x86_64) macOS build.
          Supports macOS 10.14.4 (Intel) / 11.0 (Apple Silicon) and later.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
