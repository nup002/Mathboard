<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmware Selector</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8f9fa;
            padding: 20px;
        }

        .firmware-selector {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }

        .help-text {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-style: italic;
        }

        .dropdown-container {
            position: relative;
        }

        .dropdown-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dropdown-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .dropdown-input::placeholder {
            color: #bdc3c7;
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e1e8ed;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .dropdown-list.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f1f3f4;
            transition: background-color 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: #f8f9fa;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item.selected {
            background-color: #3498db;
            color: white;
        }

        .version-group {
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            display: none;
        }

        .version-group.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .version-select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .version-select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .download-section {
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            display: none;
        }

        .download-section.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .download-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .progress-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e1e8ed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #7f8c8d;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .step.active {
            background: #3498db;
            color: white;
        }

        .step.completed {
            background: #27ae60;
            color: white;
        }

        .step-connector {
            width: 40px;
            height: 2px;
            background: #e1e8ed;
            transition: all 0.3s ease;
        }

        .step-connector.completed {
            background: #27ae60;
        }

        .no-results {
            padding: 15px;
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }

        .selected-layout {
            background: #e8f5e8;
            color: #27ae60;
            font-weight: 600;
            border-color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="firmware-selector">
        <div class="header">
            <h2>🔧 Firmware Selector</h2>
            <p>Choose your keyboard layout and download the right firmware</p>
        </div>

        <div class="progress-indicator">
            <div class="step active" id="step1">1</div>
            <div class="step-connector" id="connector1"></div>
            <div class="step" id="step2">2</div>
            <div class="step-connector" id="connector2"></div>
            <div class="step" id="step3">3</div>
        </div>

        <div class="form-group">
            <label for="layout-input">Step 1: Select Your Keyboard Layout</label>
            <div class="help-text">Start typing to search, or click to browse all available layouts</div>
            <div class="dropdown-container">
                <input 
                    type="text" 
                    id="layout-input" 
                    class="dropdown-input" 
                    placeholder="Search for your keyboard layout..."
                    autocomplete="off"
                >
                <div class="dropdown-list" id="layout-dropdown"></div>
            </div>
        </div>

        <div class="form-group version-group" id="version-group">
            <label for="version-select">Step 2: Choose Firmware Version</label>
            <div class="help-text">Select "Most recent" for the latest stable version (recommended)</div>
            <select class="version-select" id="version-select">
                <option value="latest">Most recent (recommended)</option>
                <option value="v2.1.0">v2.1.0 (Stable)</option>
                <option value="v2.0.5">v2.0.5</option>
                <option value="v2.0.4">v2.0.4</option>
                <option value="v2.0.3">v2.0.3</option>
                <option value="v1.9.2">v1.9.2</option>
                <option value="v1.9.1">v1.9.1</option>
                <option value="v1.8.5">v1.8.5</option>
            </select>
        </div>

        <div class="download-section" id="download-section">
            <div class="help-text">Step 3: Download Your Firmware</div>
            <button class="download-btn" id="download-btn">
                📥 Download Firmware
            </button>
        </div>
    </div>

    <script>
        // Sample keyboard layouts data
        const keyboardLayouts = [
            "Planck Rev6", "Planck Rev5", "Planck EZ", "Planck Light",
            "Preonic Rev3", "Preonic Rev2", "Preonic Rev1",
            "Corne (CRKBD)", "Corne Light", "Corne Cherry",
            "Lily58", "Lily58 Pro", "Lily58 Glow",
            "Kyria Rev1", "Kyria Rev2", "Kyria Rev3",
            "Sofle V1", "Sofle V2", "Sofle RGB",
            "Iris Rev4", "Iris Rev5", "Iris Rev6",
            "Levinson", "Levinson Rev2", "Levinson Rev3",
            "Helix 5 Rows", "Helix 4 Rows",
            "Ergodox EZ", "Ergodox Infinity", "Ergodox Original",
            "Moonlander", "Planck EZ Glow",
            "Discipline V1", "Discipline V2",
            "BFO-9000", "Quefrency Rev1", "Quefrency Rev2",
            "Sinc Rev1", "Sinc Rev2",
            "Redox", "Redox Wireless",
            "Dactyl", "Dactyl Manuform 4x6", "Dactyl Manuform 5x6",
            "Let's Split", "Let's Split EH",
            "Nyquist Rev2", "Nyquist Rev3",
            "Viterbi Rev1", "Viterbi Rev2",
            "Fourier", "Laplace",
            "Chocopad", "Sweet16"
        ];

        // State management
        let selectedLayout = null;
        let filteredLayouts = [...keyboardLayouts];

        // DOM elements
        const layoutInput = document.getElementById('layout-input');
        const layoutDropdown = document.getElementById('layout-dropdown');
        const versionGroup = document.getElementById('version-group');
        const versionSelect = document.getElementById('version-select');
        const downloadSection = document.getElementById('download-section');
        const downloadBtn = document.getElementById('download-btn');

        // Progress steps
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const connector1 = document.getElementById('connector1');
        const connector2 = document.getElementById('connector2');

        // Initialize the dropdown
        function initializeDropdown() {
            renderDropdownItems(keyboardLayouts);
        }

        // Render dropdown items
        function renderDropdownItems(items) {
            layoutDropdown.innerHTML = '';
            
            if (items.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = 'No layouts found matching your search';
                layoutDropdown.appendChild(noResults);
                return;
            }

            items.forEach(layout => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.textContent = layout;
                item.addEventListener('click', () => selectLayout(layout));
                layoutDropdown.appendChild(item);
            });
        }

        // Filter layouts based on search
        function filterLayouts(searchTerm) {
            const filtered = keyboardLayouts.filter(layout =>
                layout.toLowerCase().includes(searchTerm.toLowerCase())
            );
            renderDropdownItems(filtered);
        }

        // Select a layout
        function selectLayout(layout) {
            selectedLayout = layout;
            layoutInput.value = layout;
            layoutInput.classList.add('selected-layout');
            hideDropdown();
            showVersionStep();
        }

        // Show dropdown
        function showDropdown() {
            layoutDropdown.classList.add('show');
        }

        // Hide dropdown
        function hideDropdown() {
            layoutDropdown.classList.remove('show');
        }

        // Show version selection step
        function showVersionStep() {
            // Update progress
            step1.classList.remove('active');
            step1.classList.add('completed');
            connector1.classList.add('completed');
            step2.classList.add('active');

            // Show version group with animation
            setTimeout(() => {
                versionGroup.classList.add('show');
            }, 200);
        }

        // Show download step
        function showDownloadStep() {
            // Update progress
            step2.classList.remove('active');
            step2.classList.add('completed');
            connector2.classList.add('completed');
            step3.classList.add('active');

            // Show download section with animation
            setTimeout(() => {
                downloadSection.classList.add('show');
            }, 200);
        }

        // Handle download
        function handleDownload() {
            const version = versionSelect.value;
            const fileName = `${selectedLayout.replace(/\s+/g, '_').toLowerCase()}_${version}.bin`;
            
            // In a real implementation, this would trigger an actual download
            // For now, we'll just show an alert
            alert(`Downloading: ${fileName}\n\nLayout: ${selectedLayout}\nVersion: ${version}`);
            
            // You would replace this with actual download logic:
            // window.open(`/firmware/${fileName}`, '_blank');
        }

        // Event listeners
        layoutInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value;
            filterLayouts(searchTerm);
            showDropdown();
            
            // Reset selection if input is manually changed
            if (selectedLayout && e.target.value !== selectedLayout) {
                selectedLayout = null;
                layoutInput.classList.remove('selected-layout');
                versionGroup.classList.remove('show');
                downloadSection.classList.remove('show');
                
                // Reset progress
                step1.classList.add('active');
                step1.classList.remove('completed');
                step2.classList.remove('active', 'completed');
                step3.classList.remove('active', 'completed');
                connector1.classList.remove('completed');
                connector2.classList.remove('completed');
            }
        });

        layoutInput.addEventListener('focus', () => {
            if (!selectedLayout) {
                renderDropdownItems(keyboardLayouts);
                showDropdown();
            }
        });

        layoutInput.addEventListener('click', () => {
            if (!selectedLayout) {
                renderDropdownItems(keyboardLayouts);
                showDropdown();
            }
        });

        // Hide dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown-container')) {
                hideDropdown();
            }
        });

        // Handle version selection
        versionSelect.addEventListener('change', () => {
            if (selectedLayout && versionSelect.value) {
                showDownloadStep();
            }
        });

        // Handle download button
        downloadBtn.addEventListener('click', handleDownload);

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeDropdown);

        // Keyboard navigation for dropdown
        layoutInput.addEventListener('keydown', (e) => {
            const items = layoutDropdown.querySelectorAll('.dropdown-item');
            const selectedItem = layoutDropdown.querySelector('.dropdown-item.selected');
            let currentIndex = Array.from(items).indexOf(selectedItem);

            switch (e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    if (currentIndex < items.length - 1) {
                        if (selectedItem) selectedItem.classList.remove('selected');
                        items[currentIndex + 1].classList.add('selected');
                    } else if (items.length > 0) {
                        if (selectedItem) selectedItem.classList.remove('selected');
                        items[0].classList.add('selected');
                    }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (currentIndex > 0) {
                        if (selectedItem) selectedItem.classList.remove('selected');
                        items[currentIndex - 1].classList.add('selected');
                    } else if (items.length > 0) {
                        if (selectedItem) selectedItem.classList.remove('selected');
                        items[items.length - 1].classList.add('selected');
                    }
                    break;
                case 'Enter':
                    e.preventDefault();
                    if (selectedItem) {
                        selectLayout(selectedItem.textContent);
                    }
                    break;
                case 'Escape':
                    hideDropdown();
                    break;
            }
        });
    </script>
</body>
</html>
